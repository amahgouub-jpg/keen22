name: Build Base Render APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 🟢 الأداة الرسمية المدمجة لتشغيل محرك الـ NDK لترجمة ملفات الـ C++ بأعلى أمان
    - name: Setup Android NDK
      run: |
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/21.4.7075529" >> $GITHUB_ENV
        echo "${ANDROID_SDK_ROOT}/ndk/21.4.7075529" >> $GITHUB_PATH

    - name: Extract App Package
      run: |
        sudo apt-get install p7zip-full -y
        7z x app.7z -o. || unzip app.zip || true
        [ -f app.7z ] && rm app.7z || true
        [ -f app.zip ] && rm app.zip || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Base-Render-APK
        path: app/build/outputs/apk/debug/app-debug.apk
